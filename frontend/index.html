<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/opportunity-quest-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14172e" />

    <title>Opportunity Quest — Thapar University</title>
    <meta
      name="description"
      content="Discover internships, research roles and paid work at Thapar Institute — filtered to your eligibility, straight from faculty to students."
    />
    <link rel="canonical" href="https://opportunityquest.agrimverma.dev/" />

    <!-- Open Graph — the card WhatsApp, iMessage, LinkedIn, Slack, etc. render
         when this link is shared. og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Opportunity Quest" />
    <meta property="og:url" content="https://opportunityquest.agrimverma.dev/" />
    <meta property="og:title" content="Opportunity Quest — Thapar University" />
    <meta
      property="og:description"
      content="Discover internships, research roles and paid work at Thapar Institute — filtered to your eligibility, straight from faculty to students."
    />
    <meta property="og:image" content="https://opportunityquest.agrimverma.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter/X card — summary_large_image is required for the big-image
         layout; without it Twitter falls back to a small thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Opportunity Quest — Thapar University" />
    <meta
      name="twitter:description"
      content="Discover internships, research roles and paid work at Thapar Institute — filtered to your eligibility, straight from faculty to students."
    />
    <meta name="twitter:image" content="https://opportunityquest.agrimverma.dev/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
