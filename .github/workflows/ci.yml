name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The tests spin up an in-memory MongoDB as a single-node replica set —
      # required for the transactional faculty-approval flow (a standalone
      # server cannot run transactions). The mongod binary is downloaded on
      # first use and cached (see the step below) so later runs stay fast.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      # npm install (not npm ci): vitest's bundler pulls in platform-specific
      # optional dependencies whose lockfile entries differ between the Mac used
      # for development and the Linux CI runner, which trips npm ci's strict
      # check. npm install reconciles them for the runner's platform.
      - run: npm install
      - run: npm test

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
